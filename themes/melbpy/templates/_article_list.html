{% for year, year_articles in articles|groupby('date.year')|reverse %}
<h2>{{ year }}</h2>
<ul class="article-list">
{% for article in year_articles %}
  <li class="cat cat-{{ article.category.slug }}">
    <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
    <div class="meta">
      {{ article.author }} · <time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time>
    </div>
  </li>
{% endfor %}
</ul>
{% endfor %}
